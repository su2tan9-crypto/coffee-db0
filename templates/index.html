<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee</title>
</head>
<body>
    <h1>Coffee Ais</h1>
    <br>

    <style>
        body{
            background-color: black;
            color: bisque;
        }
        a{
            color: coral;
        }
    </style>

    <form action="/" method="get">
        <input type="text" name="search" value="{{ search }}" placeholder="Поиск кофе">
        <button type="submit">Найти</button>
    </form>
    <br>

    {% for drink in drinks %}
    <img src="/static/images/{{ drink.image }}" width="150">
    <br>
    <p>
        <a href="/drink/{{ drink.id }}">{{ drink.name }}</a>
    </p>
    <p>
        Цены: {{ drink.price }}
    </p>
    {% endfor %}

</body>
</html>
